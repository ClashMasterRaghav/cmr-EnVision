<!DOCTYPE html>
<html lang="en">

<head>
	<title>AR Multi-Screen Experience</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link type="text/css" rel="stylesheet" href="main.css" />

	<style>
		#info {
			position: absolute;
			top: 10px;
			width: 100%;
			text-align: center;
			color: #fff;
			background-color: rgba(0, 0, 0, 0.5);
			padding: 10px;
			border-radius: 5px;
			font-family: Arial, sans-serif;
			pointer-events: none;
			z-index: 100;
		}

		#info a {
			color: #4af;
			pointer-events: auto;
		}

		/* Hidden video element for texture */
		#videoElement {
			display: none;
		}

		/* Loading message */
		#loadingMessage {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			color: #fff;
			background-color: rgba(0, 0, 0, 0.7);
			padding: 15px 30px;
			border-radius: 10px;
			font-family: Arial, sans-serif;
			font-size: 18px;
			z-index: 200;
			/* Auto-hide after 4s in case JS stalls — the button is z-index 999 so it'll show above */
			animation: autoHideLoader 0.3s ease 4s forwards;
		}

		@keyframes autoHideLoader {
			to {
				opacity: 0;
				pointer-events: none;
				visibility: hidden;
			}
		}

		/* Notification container */
		#notificationContainer {
			position: absolute;
			bottom: 20px;
			left: 50%;
			transform: translateX(-50%);
			width: 80%;
			max-width: 300px;
			z-index: 300;
			pointer-events: none;
		}

		.notification {
			background-color: rgba(0, 0, 0, 0.7);
			color: white;
			margin-bottom: 10px;
			padding: 10px 15px;
			border-radius: 8px;
			font-family: Arial, sans-serif;
			text-align: center;
			animation: fadeInOut 2s ease-in-out forwards;
		}

		@keyframes fadeInOut {
			0% {
				opacity: 0;
				transform: translateY(20px);
			}

			10% {
				opacity: 1;
				transform: translateY(0);
			}

			90% {
				opacity: 1;
				transform: translateY(0);
			}

			100% {
				opacity: 0;
				transform: translateY(-20px);
			}
		}

		/* Error message for unsupported browsers */
		#errorMessage {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			color: #fff;
			background-color: rgba(255, 0, 0, 0.7);
			padding: 20px 30px;
			border-radius: 10px;
			font-family: Arial, sans-serif;
			font-size: 18px;
			z-index: 300;
			text-align: center;
			display: none;
		}

		#errorMessage h2 {
			margin-top: 0;
		}

		#errorMessage p {
			margin-bottom: 20px;
		}

		/* Force cyber style on the AR button/link regardless of main.css a{} rules */
		#ARButton,
		a#ARButton,
		button#ARButton {
			color: #00e5ff !important;
			text-decoration: none !important;
			font: 700 13px/1 monospace !important;
		}
	</style>
</head>

<body>
	<!-- Hidden video element that will be used as texture -->
	<video id="videoElement" loop crossorigin="anonymous" playsInline>
		<source src="videos/samplevideo1.mp4" type="video/mp4">
		<!-- Fallback to other videos if ar_videoplayback.mp4 is not found -->
		<source src="textures/sintel.mp4" type="video/mp4">
		<source src="textures/pano.mp4" type="video/mp4">
	</video>

	<!-- Loading message — hidden by JS once scene inits; falls back via CSS animation -->
	<div id="loadingMessage">Loading AR Experience...</div>

	<!-- Notification container -->
	<div id="notificationContainer"></div>

	<!-- Futuristic Floating HUD Summon Pill in DOM Overlay -->
	<div id="handControlHUD"
		style="display: none; position: fixed; bottom: 80px; right: 14px; z-index: 500; pointer-events: auto;">
		<button id="summonPanelBtn"
			style="background: rgba(14, 22, 38, 0.88); color: #00e5ff; border: 1.5px solid #00e5ff; border-radius: 22px; padding: 7px 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 5px; box-shadow: 0 0 12px rgba(0, 229, 255, 0.4); backdrop-filter: blur(8px); cursor: pointer; text-transform: uppercase; letter-spacing: 0.4px;">
			<span style="font-size: 15px;">🖐️</span>
			<span>Menu</span>
		</button>
	</div>

	<!-- Error message for unsupported browsers -->
	<div id="errorMessage">
		<h2>WebXR AR Not Supported</h2>
		<p>Your browser or device does not support WebXR Augmented Reality.</p>
		<p>Please try using a compatible browser like Chrome on an AR-capable Android device.</p>
	</div>

	<!-- Initial interaction trigger for video playback on mobile devices -->
	<div id="interactionHelper" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
			background-color: rgba(0,0,0,0.8); z-index: 1000; color: white; text-align: center; padding-top: 40%;">
		<h2>Tap to Enable Video</h2>
		<p>Tap anywhere to start your AR experience with video and audio.</p>
	</div>

	<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

	<!-- Global error catcher: logs warnings to console without blocking the screen -->
	<script>
		window.addEventListener('error', function (e) {
			console.warn('Script notice:', e.message, e.filename, e.lineno);
		});
		window.addEventListener('unhandledrejection', function (e) {
			console.warn('Unhandled promise notice:', e.reason);
		});
	</script>

	<!-- Use the main entry point file instead of ar_web.js -->
	<script type="module" src="ar_main.js"></script>
</body>

</html>
